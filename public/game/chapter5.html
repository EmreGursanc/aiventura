<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>NEX-Core: Bölüm 5 — Veri Zehirlenmesi</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#030712;font-family:'Outfit',monospace;color:white;position:fixed;inset:0}
canvas{position:absolute;inset:0;width:100%!important;height:100%!important;z-index:1}

/* HUD */
#hud{position:absolute;top:0;left:0;right:0;height:48px;background:rgba(3,7,18,.97);border-bottom:1px solid rgba(168,85,247,.3);display:none;align-items:center;justify-content:space-between;padding:0 16px;z-index:50}
.hud-badge{font-size:10px;font-weight:900;color:#a855f7;background:rgba(168,85,247,.15);border:1px solid rgba(168,85,247,.3);padding:4px 12px;border-radius:20px}
#mission-label{font-size:13px;font-weight:800;color:#e2e8f0}

/* PALETTE */
#palette{position:absolute;left:0;top:48px;bottom:60px;width:160px;background:rgba(3,7,18,.97);border-right:1px solid rgba(168,85,247,.15);z-index:50;overflow-y:auto;padding:10px 8px;display:none;flex-direction:column;gap:8px}
.pal-title{font-size:8px;font-weight:900;color:#475569;text-transform:uppercase;letter-spacing:1px;padding:4px;text-align:center;border-bottom:1px solid #0f172a;margin-bottom:4px}
.pal-block{padding:10px 8px;border-radius:10px;cursor:pointer;text-align:center;border:2px solid rgba(168,85,247,.4);background:rgba(168,85,247,.08);transition:all .2s;user-select:none}
.pal-block:hover{transform:translateY(-2px);box-shadow:0 0 14px rgba(168,85,247,.4);background:rgba(168,85,247,.18)}
.pal-block.placed{background:rgba(168,85,247,.35);border-color:#a855f7;cursor:default;transform:none}
.pal-block .pb-icon{font-size:28px;line-height:1;display:block;margin-bottom:4px}
.pal-block .pb-name{font-size:10px;font-weight:900;color:#d8b4fe}
.pal-badge{padding:8px;border-radius:8px;text-align:center;background:rgba(168,85,247,.08);border:1px solid rgba(168,85,247,.25);font-size:11px;font-weight:800;color:#a855f7}
.pal-block:not(.placed){animation:pulseBlock 2s ease-in-out infinite}
@keyframes pulseBlock{0%,100%{box-shadow:0 0 0 0 rgba(168,85,247,.5)}50%{box-shadow:0 0 0 8px rgba(168,85,247,0)}}

/* STATUS */
#status-bar{position:absolute;bottom:0;left:0;right:0;height:52px;background:rgba(3,7,18,.95);border-top:1px solid rgba(168,85,247,.2);display:none;align-items:center;justify-content:space-between;padding:0 16px 0 170px;z-index:50}
#status-text{font-size:12px;font-weight:800;color:#94a3b8}

/* NEX BARK */
#nex-bark{position:absolute;bottom:60px;left:8px;z-index:100;display:none;align-items:flex-end;gap:8px}
#nex-avatar{width:44px;height:44px;border-radius:50%;background:rgba(168,85,247,.2);border:2px solid rgba(168,85,247,.4);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
#bark-bubble{background:rgba(15,23,42,.97);border:1px solid rgba(168,85,247,.5);border-radius:12px 12px 12px 2px;padding:10px 14px;max-width:260px;font-size:12px;font-weight:700;color:#e2e8f0;line-height:1.5;display:none}
#bark-bubble.show{display:block}

/* PROGRESS DOTS */
#prog-dots{display:flex;gap:6px;align-items:center}
.pdot{width:10px;height:10px;border-radius:50%;background:#1e293b;border:2px solid #a855f7}
.pdot.active{background:#a855f7;box-shadow:0 0 8px #a855f7}

/* ACCURACY HUD */
#accuracy-hud{font-size:12px;font-weight:900;color:#a855f7;background:rgba(168,85,247,.15);border:1px solid rgba(168,85,247,.3);padding:4px 12px;border-radius:20px;display:none;margin-right:12px}

/* TUTORIAL OVERLAY */
#tutorial-overlay{position:absolute;inset:0;z-index:400;background:rgba(3,7,18,.88);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center}
.tut-box{background:#0f172a;border:2px solid #a855f7;border-radius:16px;width:90%;max-width:640px;padding:28px;display:flex;flex-direction:column;gap:18px;box-shadow:0 0 40px rgba(168,85,247,.25);animation:tutIn .4s ease-out}
@keyframes tutIn{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes nexFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.tut-body{display:flex;gap:20px;align-items:flex-start}
.tut-avatar{font-size:72px;animation:nexFloat 3s ease-in-out infinite;background:rgba(168,85,247,.1);padding:16px;border-radius:16px;border:2px solid rgba(168,85,247,.3);flex-shrink:0}
.tut-texts{flex:1;display:flex;flex-direction:column;gap:10px}
.tut-title{font-size:17px;font-weight:900;color:#a855f7;letter-spacing:1px;text-transform:uppercase}
.tut-text{font-size:15px;font-weight:700;color:#e2e8f0;line-height:1.65}
.tut-actions{display:flex;justify-content:flex-end}
.btn-tut{padding:13px 34px;font-family:'Outfit',sans-serif;font-size:14px;font-weight:900;border:none;border-radius:10px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn-tut.next{background:linear-gradient(135deg,#9333ea,#a855f7);color:#fff;box-shadow:0 0 24px rgba(168,85,247,.4)}
.btn-tut.go{background:linear-gradient(135deg,#a855f7,#9333ea);color:#fff;box-shadow:0 0 24px rgba(168,85,247,.4)}
.btn-tut:hover{transform:scale(1.06)}

/* WIN / FAIL OVERLAY */
#result-overlay{position:absolute;inset:0;z-index:300;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#result-overlay.win{background:radial-gradient(ellipse,#2e1065,#030712)}
#result-overlay.fail{background:radial-gradient(ellipse,#4c1d95,#030712)}
.result-title{font-size:32px;font-weight:900}
.result-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px 20px;font-size:13px;font-weight:700;color:#94a3b8;max-width:420px;line-height:1.7}
.btn-result{padding:12px 28px;font-family:'Outfit',sans-serif;font-size:13px;font-weight:900;border:none;border-radius:8px;cursor:pointer;margin:4px}
.btn-retry{background:#7e22ce;color:#e9d5ff}

/* CONFIG MODAL */
#config-modal{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#0f172a;border:2px solid #a855f7;border-radius:12px;padding:24px;z-index:500;display:none;flex-direction:column;gap:16px;box-shadow:0 0 40px rgba(168,85,247,.4);width:320px}
#config-modal h3{font-size:16px;font-weight:900;color:#a855f7;margin-bottom:8px;text-align:center;text-transform:uppercase}
.data-choice{transition:transform 0.2s, box-shadow 0.2s;}
.data-choice:hover{transform:scale(1.1); box-shadow:0 0 12px rgba(255,255,255,0.2);}
.data-choice.selected{transform:scale(1.15); box-shadow:0 0 16px #a855f7; border:2px solid #fff !important;}
.btn-confirm{background:linear-gradient(135deg,#9333ea,#a855f7);color:#fff;border:none;padding:12px;border-radius:8px;font-family:'Outfit',sans-serif;font-weight:900;font-size:14px;cursor:pointer;margin-top:8px;transition:transform .15s}
.btn-confirm:hover{transform:scale(1.05)}

/* FLOATING TEXTS */
#float-layer{position:absolute;inset:0;pointer-events:none;z-index:200;overflow:hidden}
.float-bubble{position:absolute;transform:translate(-50%,-100%);background:rgba(15,23,42,.85);border:1px solid #334155;color:#e2e8f0;padding:6px 10px;border-radius:8px;font-size:11px;font-weight:800;white-space:nowrap;transition:opacity .3s;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.float-bubble.shoot{border-color:#ef4444;color:#fca5a5}
.float-bubble.pass{border-color:#10b981;color:#6ee7b7}
.float-bubble.quarantine{border-color:#a855f7;color:#d8b4fe}
</style>
<script src="/game/audio.js"></script>
</head>
<body>

<!-- HUD -->
<div id="hud">
  <div style="display:flex;align-items:center;gap:10px">
    <div class="hud-badge">BÖLÜM 5</div>
    <div id="mission-label">Veri Zehirlenmesi</div>
  </div>
  <div style="display:flex;align-items:center;">
    <div id="accuracy-hud">KARANTİNA ORANI: %<span id="acc-val">100</span></div>
    <div id="prog-dots">
      <div class="pdot" id="pd1"></div>
      <div class="pdot" id="pd2"></div>
      <div class="pdot" id="pd3"></div>
    </div>
  </div>
</div>

<!-- PALETTE -->
<div id="palette">
  <div class="pal-title">🛠 Savunma</div>
  <div id="pal-items"></div>
</div>

<!-- NEX BARK -->
<div id="nex-bark">
  <div id="nex-avatar">🤖</div>
  <div id="bark-bubble"><span id="bark-text"></span></div>
</div>

<!-- STATUS BAR -->
<div id="status-bar">
  <span id="status-text">⏳ Modülleri yerleştir, sonra savaş başlasın!</span>
</div>

<!-- TUTORIAL OVERLAY -->
<div id="tutorial-overlay">
  <div class="tut-box">
    <div class="tut-body">
      <div class="tut-avatar">🤖</div>
      <div class="tut-texts">
        <div class="tut-title" id="tut-title">YÜKLENİYOR</div>
        <div class="tut-text" id="tut-text">...</div>
      </div>
    </div>
    <div class="tut-actions">
      <button class="btn-tut next" id="tut-btn" onclick="nextTutStep()">Devam Et ➔</button>
    </div>
  </div>
</div>

<!-- RESULT OVERLAY -->
<div id="result-overlay">
  <div class="result-title" id="result-title"></div>
  <div class="result-card" id="result-card"></div>
  <div>
    <button class="btn-result btn-next" id="btn-next" style="display:none" onclick="goNext()">SONRAKİ GÖREVE GEÇ ➔</button>
    <button class="btn-result btn-map" id="btn-map" style="display:none" onclick="goMap()">🗺 HARİTAYA DÖN</button>
    <button class="btn-result btn-retry" id="btn-retry" style="display:none" onclick="location.reload()">↺ TEKRAR DENE</button>
  </div>
</div>

<!-- CONFIG MODAL -->
<div id="config-modal">
  <h3 id="cfg-title">Antivirüs Eğitimi</h3>
  <div style="font-size:14px; margin-bottom: 12px; text-align:center; color:#e2e8f0;">Yapay Zeka'ya zehirli veriyi tespit etmeyi öğret! Hangisi zehirli?</div>
  <div class="cfg-choices" style="display:flex; gap:20px; justify-content:center; align-items:center;">
    <div class="data-choice" data-type="blue" style="width:40px; height:40px; background:#3b82f6; border-radius:4px; cursor:pointer;" onclick="selectPoison(this)"></div>
    <div class="data-choice" data-type="fast_blue" style="width:40px; height:40px; background:#0ea5e9; border-radius:4px; cursor:pointer;" onclick="selectPoison(this)"></div>
    <div class="data-choice" data-type="poison" style="width:40px; height:40px; background:#d946ef; border: 2px dashed #f0abfc; border-radius:4px; cursor:pointer;" onclick="selectPoison(this)"></div>
  </div>
  <div id="cfg-error" style="color:#ef4444; font-size:12px; text-align:center; display:none; margin-top:8px;">Hata: Bu temiz bir veri! Lütfen zehirli (anormal) olanı seç.</div>
  <button class="btn-confirm" id="btn-cfg-confirm" style="display:none;" onclick="confirmConfig()">Onayla ve Yerleştir</button>
</div>

<!-- FLOATING TEXTS LAYER -->
<div id="float-layer"></div>

<canvas id="c"></canvas>

<script>
'use strict';

const MISSION = new URLSearchParams(window.location.search).get('mission') || 'c-g5-1';

// ── TUTORIAL DATA ────────────────────────────────────────────────
const TUT = {
  'c-g5-1': [
    { title: 'VERİ ZEHİRLENMESİ!', text: 'GLITCH, yapay zekayı kandırmak için temiz mavi verilerin arasına "Zehirli" (Mor) veriler yerleştirdi!' },
    { title: 'YENİ TEHDİT', text: 'Zehirli veriler ilk bakışta temiz gibi görünür ama içlerinde gizli virüs kodları taşırlar. Çekirdeğe ulaşırlarsa AI mantığını bozar.' },
    { title: 'GÖREV', text: '💉 Antivirüs bloğunu yerleştir ve yapay zekaya zehirli verileri tespit etmeyi öğret!' }
  ],
  'c-g5-2': [
    { title: 'KARANTİNA ZAMANI', text: 'Zehirli verileri doğrudan yok etmek (patlatmak) bazen tehlikeli olabilir, çünkü içlerindeki zararlı kodlar etrafa saçılabilir.' },
    { title: 'GÜVENLİ ALAN', text: 'Bu yüzden onları yok etmek yerine Karantina altına almalıyız.' },
    { title: 'GÖREV', text: 'Hem 💉 Antivirüs hem de 🛡️ Karantina bloklarını yerleştir.' }
  ],
  'c-g5-3': [
    { title: 'SÜRÜ PSİKOLOJİSİ', text: 'GLITCH devasa bir veri sürüsü gönderiyor! Zehirli veriler temiz olanların arasına iyice saklanmış.' },
    { title: 'GÖREV', text: 'Tüm savunma bloklarını yerleştir ve yapay zekanın zehirli verileri %100 doğrulukla karantinaya almasını sağla!' }
  ]
};

// ── MISSION CONFIG ───────────────────────────────────────────────
const CFG = {
  'c-g5-1': {
    label: 'Görev 5.1 — Kötü Örnekler',
    dot: 1,
    palette: [{ id:'antivirus', icon:'💉', name:'Antivirüs', max:1 }],
    xp: 500,
    wave: [
      {time:2, type:'blue'}, {time:4, type:'poison'}, {time:7, type:'blue'}, {time:10, type:'poison'}, {time:13, type:'poison'}
    ]
  },
  'c-g5-2': {
    label: 'Görev 5.2 — Çöp Kutusu',
    dot: 2,
    palette: [
      { id:'antivirus', icon:'💉', name:'Antivirüs', max:1 },
      { id:'karantina', icon:'🛡️', name:'Karantina', max:1 }
    ],
    xp: 500,
    wave: [
      {time:2, type:'poison'}, {time:4, type:'blue'}, {time:6, type:'blue'}, {time:8, type:'poison'}, {time:10, type:'blue'}, {time:12, type:'poison'}
    ]
  },
  'c-g5-3': {
    label: 'Görev 5.3 — Sürü Psikolojisi',
    dot: 3,
    palette: [
      { id:'antivirus', icon:'💉', name:'Antivirüs', max:1 },
      { id:'karantina', icon:'🛡️', name:'Karantina', max:1 }
    ],
    xp: 600,
    wave: [
       {time:2, type:'blue'}, {time:3, type:'poison'}, {time:4, type:'blue'},
       {time:5, type:'poison'}, {time:6, type:'poison'}, {time:7, type:'blue'},
       {time:8, type:'poison'}, {time:10, type:'blue'}, {time:11, type:'poison'},
       {time:12, type:'poison'}, {time:13, type:'blue'}, {time:15, type:'poison'}
    ]
  }
}[MISSION] || (() => { window.parent.location.href = '/ders/c-g5-1'; })();

// ── THREE.JS SETUP ───────────────────────────────────────────────
const canvas = document.getElementById('c');
const W = () => canvas.parentElement?.clientWidth || window.innerWidth;
const H = () => canvas.parentElement?.clientHeight || window.innerHeight;

const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(W(), H());

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030712);

const camera = new THREE.PerspectiveCamera(60, W()/H(), 0.1, 200);
camera.position.set(0, 16, 22);
camera.lookAt(0, 0, 0);

window.addEventListener('resize', () => {
  renderer.setSize(W(), H());
  camera.aspect = W()/H();
  camera.updateProjectionMatrix();
});

// Lighting
const ambient = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambient);
const dirLight = new THREE.DirectionalLight(0xa855f7, 0.8);
dirLight.position.set(10, 20, 10);
scene.add(dirLight);

// AI Core
const coreGeo = new THREE.IcosahedronGeometry(1.5, 0);
const coreMat = new THREE.MeshPhongMaterial({ color:0xa855f7, emissive:0xa855f7, emissiveIntensity:0.4, wireframe:true });
const core = new THREE.Mesh(coreGeo, coreMat);
core.position.y = 2.2;
scene.add(core);

const coreLight = new THREE.PointLight(0xa855f7, 3, 8);
coreLight.position.set(0, 2.5, 0);
scene.add(coreLight);

const baseGeo = new THREE.CylinderGeometry(3, 3.5, 0.5, 16);
const baseMat = new THREE.MeshPhongMaterial({ color:0x222222, emissive:0xa855f7, emissiveIntensity:0.05 });
const base = new THREE.Mesh(baseGeo, baseMat);
base.position.y = 0.25;
scene.add(base);

// Rings around core
for (let i = 0; i < 3; i++) {
  const rg = new THREE.TorusGeometry(2 + i*0.5, 0.04, 8, 48);
  const rm = new THREE.MeshBasicMaterial({ color: 0xa855f7, transparent: true, opacity: 0.3 - i*0.08 });
  const r = new THREE.Mesh(rg, rm);
  r.rotation.x = Math.PI/2 + i * 0.3;
  r.position.y = 2.2;
  scene.add(r);
}

// Grid
const grid = new THREE.GridHelper(50, 50, 0xa855f7, 0x0f172a);
scene.add(grid);

// ── GAME STATE ───────────────────────────────────────────────────
const G = {
  phase: 'waiting',    
  time: 0,
  enemies: [],
  lasers: [],
  blasts: [],
  bubbles: [],
  floatTexts: [],
  waveIdx: 0,
  killed: 0,
  safePassed: 0,
  placed: [],
  winTriggered: false
};

// ── UI INIT ──────────────────────────────────────────────────────
document.getElementById('mission-label').textContent = CFG.label;

// Progress dots
const dotMap = { 1:'pd1', 2:'pd2', 3:'pd3' };
for (let i = 1; i <= CFG.dot; i++) {
  document.getElementById(dotMap[i]).classList.add('active');
}

if (MISSION === 'c-g5-3') {
  document.getElementById('accuracy-hud').style.display = 'block';
}

// Palette items
const palItems = document.getElementById('pal-items');
CFG.palette.forEach(p => {
  const d = document.createElement('div');
  d.className = 'pal-block';
  d.id = 'pb-' + p.id;
  d.innerHTML = `<span class="pb-icon">${p.icon}</span><span class="pb-name">${p.name}</span>`;
  d.onclick = () => placeBlock(p.id, d);
  palItems.appendChild(d);
});

// ── NEX BARK ─────────────────────────────────────────────────────
let barkTimer = null;
function bark(txt, mood='normal') {
  const el = document.getElementById('bark-bubble');
  document.getElementById('bark-text').textContent = txt;
  el.style.borderColor = mood==='danger'?'#ef4444':mood==='warn'?'#a855f7':'#a855f7';
  el.classList.add('show');
  clearTimeout(barkTimer);
  barkTimer = setTimeout(() => el.classList.remove('show'), 5000);
}

// ── TUTORIAL ─────────────────────────────────────────────────────
let tutStep = 0;
const tutSteps = TUT[MISSION] || TUT['c-g5-1'];

function showTutStep() {
  const s = tutSteps[tutStep];
  document.getElementById('tut-title').textContent = s.title;
  document.getElementById('tut-text').textContent = s.text;
  const btn = document.getElementById('tut-btn');
  if (tutStep === tutSteps.length - 1) {
    btn.textContent = '⚡ GÖREVE BAŞLA!';
    btn.className = 'btn-tut go';
  } else {
    btn.textContent = 'Devam Et ➔';
    btn.className = 'btn-tut next';
  }
}

function nextTutStep() {
  tutStep++;
  if (tutStep >= tutSteps.length) {
    startGame();
  } else {
    showTutStep();
  }
}

function startGame() {
  document.getElementById('tutorial-overlay').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  document.getElementById('palette').style.display = 'flex';
  document.getElementById('nex-bark').style.display = 'flex';
  document.getElementById('status-bar').style.display = 'flex';
  
  if (MISSION === 'c-g5-1') {
    document.getElementById('status-text').textContent = '⏳ Sadece mor (zehirli) verileri tespit edip vur!';
    bark('💉 Antivirüs bloğunu yerleştir ve zehirli verileri temiz verilerden ayır!', 'warn');
  } else if (MISSION === 'c-g5-2') {
    document.getElementById('status-text').textContent = '⏳ Zehirli verileri karantinaya al!';
    bark('🛡️ Karantina bloğunu da yerleştirmeyi unutma!', 'warn');
  } else if (MISSION === 'c-g5-3') {
    document.getElementById('status-text').textContent = '⏳ Gelen sürüyü dikkatle incele ve güvenliği sağla!';
    bark('Saldırı çok büyük! Her iki savunmayı da yerleştir.', 'danger');
  }
  G.phase = 'playing';
}

// ── PLACE BLOCK (WITH CONFIG MODAL) ──────────────────────────────
let pendingBlockId = null;
let pendingBlockEl = null;

function placeBlock(id, el) {
  if (el.classList.contains('placed')) return;
  
  if (id === 'antivirus') {
    pendingBlockId = id;
    pendingBlockEl = el;
    
    if (G.phase === 'playing') G.phase = 'config';
    
    // Reset modal state
    document.querySelectorAll('.data-choice').forEach(c => c.classList.remove('selected'));
    document.getElementById('cfg-error').style.display = 'none';
    document.getElementById('btn-cfg-confirm').style.display = 'none';
    
    document.getElementById('config-modal').style.display = 'flex';
  } else {
    finalizePlacement(id, el, null);
  }
}

function selectPoison(el) {
  document.querySelectorAll('.data-choice').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  
  const type = el.getAttribute('data-type');
  if (type !== 'poison') {
    document.getElementById('cfg-error').style.display = 'block';
    document.getElementById('btn-cfg-confirm').style.display = 'none';
  } else {
    document.getElementById('cfg-error').style.display = 'none';
    document.getElementById('btn-cfg-confirm').style.display = 'block';
  }
}

function confirmConfig() {
  document.getElementById('config-modal').style.display = 'none';
  if (G.phase === 'config') G.phase = 'playing';
  finalizePlacement(pendingBlockId, pendingBlockEl, 'poison');
}

function finalizePlacement(id, el, configVal) {
  el.classList.add('placed');
  G.placed.push({ id, configVal });

  if (id === 'antivirus') {
    bark(`💉 Antivirüs eklendi! Artık zehirli verileri (mor) tespit edebiliriz.`, 'normal');
    document.getElementById('status-text').textContent = '💉 Antivirüs AKTİF';
    addPlacementVisuals();
  } else if (id === 'karantina') {
    bark(`🛡️ Karantina aktif! Zehirli veriler patlatılmak yerine hapsedilecek.`, 'normal');
    document.getElementById('status-text').textContent = '🛡️ Karantina AKTİF';
    addPlacementVisuals();
  }
  
  if (MISSION === 'c-g5-3' && G.placed.length === 2) {
    document.getElementById('status-text').textContent = 'Tüm Savunmalar Devrede! %100 Koruma!';
  }
}

function addPlacementVisuals() {
  const blastGeo = new THREE.RingGeometry(0.5, 1.2, 64);
  const blastMat = new THREE.MeshBasicMaterial({ color:0xa855f7, transparent:true, opacity:0.8, side:THREE.DoubleSide });
  const blast = new THREE.Mesh(blastGeo, blastMat);
  blast.rotation.x = -Math.PI/2;
  blast.position.y = 0.5;
  scene.add(blast);
  let s = 1;
  const animBlast = () => {
    s += 0.4;
    blast.scale.setScalar(s);
    blastMat.opacity -= 0.02;
    if(blastMat.opacity > 0) requestAnimationFrame(animBlast);
    else scene.remove(blast);
  };
  animBlast();
}

// ── SPAWN ENEMY ─────────────────────────────────────────────────
function spawnEnemy(type) {
  const angle = Math.random() * Math.PI * 2;
  const dist = 14;

  let geo, mat, speed, isVirus;
  if (type === 'blue') {
    geo = new THREE.OctahedronGeometry(0.8, 0);
    mat = new THREE.MeshPhongMaterial({ color:0x3b82f6, emissive:0x3b82f6, emissiveIntensity:0.3 });
    speed = 0.06;
    isVirus = false;
  } else if (type === 'poison') {
    geo = new THREE.OctahedronGeometry(0.8, 0);
    mat = new THREE.MeshPhongMaterial({ color:0xd946ef, emissive:0xd946ef, emissiveIntensity:0.6, wireframe:true });
    speed = 0.06;
    isVirus = true;
  }

  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(Math.cos(angle)*dist, 1.2, Math.sin(angle)*dist);
  scene.add(mesh);
  
  const e = { mesh, type, speed, isVirus, active:true };
  G.enemies.push(e);
}

// ── FLOATING TEXT ────────────────────────────────────────────────
function showThought(mesh, text, type) {
  const div = document.createElement('div');
  div.className = `float-bubble ${type}`;
  div.textContent = text;
  document.getElementById('float-layer').appendChild(div);
  
  G.floatTexts.push({
    el: div,
    mesh: mesh,
    t: 1.5,
    offsetY: 2
  });
}

// ── SHOOT ────────────────────────────────────────────────────────
let lastShot = 0;
function tryShoot(dt) {
  if (G.time - lastShot < 0.8) return;

  const hasAntivirus = G.placed.some(p => p.id === 'antivirus');
  const hasQuarantine = G.placed.some(p => p.id === 'karantina');

  let target = null;
  let quarantineAction = false;
  
  for (const e of G.enemies) {
    if (!e.active) continue;

    let shouldShoot = false;
    let logicReason = '';
    
    const isPoison = e.type === 'poison';
    
    // Logic Rules
    if (!hasAntivirus) {
       // Without Antivirus, AI thinks all Octahedrons are clean data
       shouldShoot = false;
       logicReason = 'Filtresiz';
    } else {
       if (isPoison) {
         shouldShoot = true;
         logicReason = 'Tehdit';
       } else {
         shouldShoot = false;
         logicReason = 'Temiz';
       }
    }
    
    const d = e.mesh.position.length();
    
    if (d < 12.5 && !e.scanned) {
        e.scanned = true;
        if (!shouldShoot) {
            showThought(e.mesh, `${logicReason} ➔ GEÇİR`, 'pass');
        }
    }

    if (d < 12 && shouldShoot) {
      target = e;
      target.lastReason = logicReason;
      if (hasQuarantine) quarantineAction = true;
      break;
    }
  }

  if (!target) return;
  lastShot = G.time;

  showThought(target.mesh, quarantineAction ? `${target.lastReason} ➔ KARANTİNA` : `${target.lastReason} ➔ SİL`, quarantineAction ? 'quarantine' : 'shoot');

  // Laser beam
  const pts = [core.position.clone(), target.mesh.position.clone()];
  const lg = new THREE.BufferGeometry().setFromPoints(pts);
  const lm = new THREE.LineBasicMaterial({ color: quarantineAction ? 0xd946ef : 0xef4444 });
  const beam = new THREE.Line(lg, lm);
  scene.add(beam);
  if(window.playLaserSound) window.playLaserSound();
  G.lasers.push({ mesh:beam, t:0.25 });

  if (!target.isVirus) {
    if(window.playExplosionSound) window.playExplosionSound(); endGame(false, 'HATA! Temiz mavi veriye müdahale ettin. Sistem zarar gördü.');
    return;
  }

  if (quarantineAction) {
    // Bubble effect
    target.active = false;
    const bGeo = new THREE.SphereGeometry(1.2, 16, 16);
    const bMat = new THREE.MeshPhongMaterial({ color:0xa855f7, transparent:true, opacity:0.6, shininess:100 });
    const bubble = new THREE.Mesh(bGeo, bMat);
    bubble.position.copy(target.mesh.position);
    scene.add(bubble);
    // Move the actual mesh inside the bubble
    target.mesh.position.set(0,0,0);
    bubble.add(target.mesh);
    G.bubbles.push({ mesh:bubble, t:0, maxT:2.0 });
    G.killed++;
  } else {
    // Destroy
    scene.remove(target.mesh);
    target.active = false;
    G.killed++;

    // Blast
    const bg = new THREE.SphereGeometry(0.6, 8, 8);
    const bm = new THREE.MeshBasicMaterial({ color:0xd946ef, wireframe:true });
    const blast = new THREE.Mesh(bg, bm);
    blast.position.copy(target.mesh.position);
    scene.add(blast);
    G.blasts.push({ mesh:blast, t:0.4 });
  }

  document.getElementById('status-text').textContent = `✅ Etkisiz Hale Getirilen: ${G.killed}`;
}

// ── END GAME ─────────────────────────────────────────────────────
function endGame(win, msg) {
  if (G.phase === 'win' || G.phase === 'fail') return;
  G.phase = win ? 'win' : 'fail';

  const ov = document.getElementById('result-overlay');
  ov.className = win ? 'win' : 'fail';
  ov.style.display = 'flex';

  if (win) {
    document.getElementById('result-title').textContent = '🎉 BAŞARDIK!';
    document.getElementById('result-title').style.color = '#a855f7';
    
    if (MISSION === 'c-g5-3') {
      document.getElementById('result-card').innerHTML = `
        <div style="margin-bottom:12px;">Zehirli veri saldırısı tamamen durduruldu! Veri setimiz tertemiz. <strong>${CFG.xp} XP</strong> kazanıldı.</div>
        <div style="background: rgba(168, 85, 247, 0.15); border-left: 3px solid #a855f7; padding: 10px; text-align: left; font-size: 11.5px; color: #d8b4fe;">
          <strong>💡 Neden Önemli?</strong><br>
          "Veri Zehirlenmesi" (Data Poisoning) yapay zeka modellerine zarar vermek için kasıtlı olarak hatalı veriler eklenmesidir. 
          Eğer yapay zeka bu zehirli verileri temiz sanıp öğrenirse, yanlış kararlar vermeye başlar. Antivirüs mantığı ve filtreleme bu yüzden çok önemlidir!
        </div>
      `;
    } else {
      document.getElementById('result-card').textContent = `Yapay Zeka zehirli veriyi başarıyla tespit etti! ${CFG.xp} XP kazanıldı.`;
    }
    
    if (MISSION === 'c-g5-3') {
      document.getElementById('btn-map').style.display = 'inline-block';
    } else {
      document.getElementById('btn-next').style.display = 'inline-block';
    }
    if (window.parent) window.parent.postMessage({ type:'UNDERTALE_SECTION_CLEARED', xp:CFG.xp }, '*');
  } else {
    document.getElementById('result-title').textContent = '💥 SİSTEM ZEHİRLENDİ!';
    document.getElementById('result-title').style.color = '#ef4444';
    document.getElementById('result-card').textContent = msg;
    document.getElementById('btn-retry').style.display = 'inline-block';
  }
}

function goNext() {
  if (MISSION === 'c-g5-1') window.parent.location.href = '/ders/c-g5-2';
  else if (MISSION === 'c-g5-2') window.parent.location.href = '/ders/c-g5-3';
}
function goMap() {
  if (window.parent) window.parent.location.href = '/dersler';
}

// ── ANIMATE LOOP ─────────────────────────────────────────────────
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  core.rotation.y += dt * 0.8;
  core.position.y = 2.2 + Math.sin(Date.now() * 0.002) * 0.15;

  if (G.phase !== 'playing') {
    renderer.render(scene, camera);
    return;
  }

  G.time += dt;

  // Spawn wave
  if (G.waveIdx < CFG.wave.length && G.time >= CFG.wave[G.waveIdx].time) {
    const w = CFG.wave[G.waveIdx];
    spawnEnemy(w.type);
    G.waveIdx++;
  }

  // Move enemies
  G.enemies.forEach(e => {
    if (!e.active) return;
    const dir = new THREE.Vector3().copy(e.mesh.position).negate().normalize();
    e.mesh.position.addScaledVector(dir, e.speed);
    
    e.mesh.rotation.y += dt;
    if (e.isVirus) {
      e.mesh.rotation.x += dt * 1.5;
    }
    
    const dist = e.mesh.position.length();
    if (dist < 2.8) {
      if (e.isVirus) {
        if(window.playExplosionSound) window.playExplosionSound(); endGame(false, 'Zehirli veri çekirdeğe sızdı! Yapay zeka yozlaştı.');
      } else {
        // Blue clean data passes safely
        scene.remove(e.mesh);
        e.active = false;
        G.safePassed++;
      }
    }
  });

  // Shoot
  tryShoot(dt);

  // Update lasers
  G.lasers = G.lasers.filter(l => {
    l.t -= dt;
    if (l.t <= 0) { scene.remove(l.mesh); return false; }
    return true;
  });

  // Update blasts
  G.blasts = G.blasts.filter(b => {
    b.t -= dt;
    b.mesh.scale.multiplyScalar(1.06);
    if (b.mesh.material) b.mesh.material.opacity = b.t / 0.4;
    if (b.t <= 0) { scene.remove(b.mesh); return false; }
    return true;
  });

  // Update bubbles (quarantine)
  G.bubbles = G.bubbles.filter(b => {
    b.t += dt;
    b.mesh.position.y += dt * 2.5; // Float up
    if (b.mesh.material) {
       b.mesh.material.opacity = 0.6 * (1 - (b.t / b.maxT));
    }
    if (b.t >= b.maxT) {
      scene.remove(b.mesh);
      return false;
    }
    return true;
  });

  // Update floating texts
  G.floatTexts = G.floatTexts.filter(ft => {
    ft.t -= dt;
    ft.offsetY += dt * 1.5;
    
    // Project 3D pos to 2D screen
    const pos = ft.mesh.position.clone();
    pos.y += ft.offsetY;
    pos.project(camera);
    
    const x = (pos.x * .5 + .5) * W();
    const y = (pos.y * -.5 + .5) * H();
    
    ft.el.style.left = `${x}px`;
    ft.el.style.top = `${y}px`;
    ft.el.style.opacity = Math.max(0, ft.t / 1.5);
    
    if (ft.t <= 0) {
      ft.el.remove();
      return false;
    }
    return true;
  });

  // Win check
  const hasActiveEnemies = G.enemies.some(e => e.active);
  const hasActiveBubbles = G.bubbles.length > 0;
  if (!G.winTriggered && G.waveIdx >= CFG.wave.length && !hasActiveEnemies && !hasActiveBubbles) {
    G.winTriggered = true;
    setTimeout(() => endGame(true, ''), 800);
  }

  renderer.render(scene, camera);
}

// ── BOOT ─────────────────────────────────────────────────────────
showTutStep();
animate();
</script>
